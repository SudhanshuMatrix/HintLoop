services:
  - type: web
    name: hintloop
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: AI_PROVIDER
        value: openrouter
      - key: AI_MODEL
        value: google/gemma-2-9b-it:free
      - key: AI_API_KEY
        sync: false
